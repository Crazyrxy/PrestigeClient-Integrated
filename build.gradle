plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:intermediary:${project.minecraft_version}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    compileOnly 'net.java.dev.jna:jna:5.17.0'
    compileOnly 'org.projectlombok:lombok:1.18.44'
    annotationProcessor 'org.projectlombok:lombok:1.18.44'

    implementation files(
            'libs/lwjgl-nanovg-3.4.1.jar',
            'libs/lwjgl-nanovg-3.4.1-natives-linux.jar',
            'libs/lwjgl-nanovg-3.4.1-natives-macos.jar',
            'libs/lwjgl-nanovg-3.4.1-natives-windows.jar'
    )
}

processResources {
    filteringCharset "UTF-8"
}

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release.set(targetJavaVersion)
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

jar {
    from("LICENSE_prestige") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
    from('libs') {
        include '*.jar'
        into 'META-INF/jars'
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
